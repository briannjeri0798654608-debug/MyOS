name: Build MyOS APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install buildozer cython==0.29.33

    - name: Create main.py
      run: |
        cp myos_launcher.py main.py

    - name: Create buildozer.spec
      run: |
        buildozer init
        sed -i 's/^title = .*/title = MyOS/' buildozer.spec
        sed -i 's/^package.name = .*/package.name = myos/' buildozer.spec
        sed -i 's/^package.domain = .*/package.domain = org.myos/' buildozer.spec
        sed -i 's/^requirements = .*/requirements = python3,kivy==2.2.1,kivymd/' buildozer.spec
        sed -i 's/^#android.permissions = .*/android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE/' buildozer.spec
        sed -i 's/^android.api = .*/android.api = 33/' buildozer.spec
        sed -i 's/^android.minapi = .*/android.minapi = 21/' buildozer.spec
        sed -i 's/^#android.archs = .*/android.archs = arm64-v8a/' buildozer.spec

    - name: Build APK
      run: |
        buildozer -v android debug 2>&1 | tail -50

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: MyOS-APK
        path: bin/*.apk
