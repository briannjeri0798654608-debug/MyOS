name: Build MyOS APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install buildozer cython kivy
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'SPEC'
        [app]
        title = MyOS
        package.name = myos
        package.domain = org.myos
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 2.0
        requirements = python3,kivy
        orientation = portrait
        fullscreen = 1
        android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE
        android.api = 33
        android.minapi = 21
        android.archs = arm64-v8a
        [buildozer]
        log_level = 2
        SPEC

    - name: Build APK
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: MyOS-APK
        path: bin/*.apk
